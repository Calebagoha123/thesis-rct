name: PCP outcome regression tests

on:
  pull_request:
    paths:
      - 'qualtrics-pcp-posttest*.html'
      - 'qualtrics-pcp-js.js'
      - 'pcp_items*.js'
      - 'pcp_scor*.js'
      - 'test_pcp_outcomes.cjs'
      - 'package*.json'
      - '.github/workflows/pcp-outcomes.yml'
  push:
    branches: [main]
    paths:
      - 'qualtrics-pcp-posttest*.html'
      - 'qualtrics-pcp-js.js'
      - 'pcp_items*.js'
      - 'pcp_scor*.js'
      - 'test_pcp_outcomes.cjs'
      - 'package*.json'
      - '.github/workflows/pcp-outcomes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:outcomes
      - run: node pcp_score.js --test
